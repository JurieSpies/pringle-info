<!-- Overstrand Lifeline app icon — "coastal lifeline": a two-tone life ring
     (crisis red + paper quadrants, red-edged webbing straps) around the
     emergency phone handset, on a warm sand tile.
     Design tokens: crisis #C1292E · paper #F9F5EA · sand #EFE7D5 · ink #12100E -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- tile -->
  <rect width="512" height="512" rx="108" fill="#EFE7D5"/>

  <!-- ring base -->
  <circle cx="256" cy="256" r="198" fill="#F9F5EA"/>

  <!-- crisis-red quadrants (top-right & bottom-left; the other two stay paper) -->
  <path d="M256 58 A198 198 0 0 1 454 256 L384 256 A128 128 0 0 0 256 128 Z" fill="#C1292E"/>
  <path d="M256 454 A198 198 0 0 1 58 256 L128 256 A128 128 0 0 0 256 384 Z" fill="#C1292E"/>

  <!-- hole -->
  <circle cx="256" cy="256" r="128" fill="#EFE7D5"/>

  <!-- webbing straps (top / bottom / left / right) -->
  <g fill="#F9F5EA" stroke="#C1292E" stroke-width="5">
    <rect x="242" y="60" width="28" height="68" rx="14"/>
    <rect x="242" y="384" width="28" height="68" rx="14"/>
    <rect x="60" y="242" width="68" height="28" rx="14"/>
    <rect x="384" y="242" width="68" height="28" rx="14"/>
  </g>

  <!-- phone handset (Material "call" glyph, ink) -->
  <path transform="translate(167.6 182.4) scale(6.4)" fill="#12100E"
    d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>

  <!-- hairline ring edges (after everything, for crisp definition) -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="#12100E" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#12100E" stroke-opacity="0.08" stroke-width="4"/>
</svg>
